<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="wt wd">
  <title id="wt">How a scan works</title>
  <desc id="wd">Five stages: read the files, detect which Top 10 lists apply, check the rules of those lists, tidy the findings, then write the report and the exit code.</desc>
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#12335a"/>
    </linearGradient>
    <linearGradient id="wnum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1200" height="330" rx="22" fill="url(#wbg)"/>
  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="600" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#e2e8f0">One command, five stages, nothing leaves your machine</text>

    <!-- arrows -->
    <g stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)" fill="none">
      <path d="M234 190 H262"/><path d="M458 190 H486"/><path d="M682 190 H710"/><path d="M906 190 H934"/>
    </g>

    <!-- 1 read -->
    <g>
      <rect x="40" y="86" width="194" height="208" rx="16" fill="#0b1f3a" stroke="#38bdf8" stroke-opacity="0.35"/>
      <circle cx="68" cy="116" r="15" fill="url(#wnum)"/><text x="68" y="122" text-anchor="middle" font-size="16" font-weight="800" fill="#06202b">1</text>
      <text x="92" y="123" font-size="19" font-weight="700" fill="#e2e8f0">Read</text>
      <g font-size="14" fill="#cbd5e1">
        <text x="58" y="160">Python and TS/JS source</text>
        <text x="58" y="182">mcp.json manifests</text>
        <text x="58" y="204">requirements, package.json</text>
        <text x="58" y="236" fill="#94a3b8">Comments and docstrings</text>
        <text x="58" y="256" fill="#94a3b8">are set aside.</text>
      </g>
    </g>

    <!-- 2 detect -->
    <g>
      <rect x="264" y="86" width="194" height="208" rx="16" fill="#0b1f3a" stroke="#38bdf8" stroke-opacity="0.35"/>
      <circle cx="292" cy="116" r="15" fill="url(#wnum)"/><text x="292" y="122" text-anchor="middle" font-size="16" font-weight="800" fill="#06202b">2</text>
      <text x="316" y="123" font-size="19" font-weight="700" fill="#e2e8f0">Detect</text>
      <g font-size="14" fill="#cbd5e1">
        <text x="282" y="160">Imports and dependencies</text>
        <text x="282" y="182">choose the Top 10 lists:</text>
      </g>
      <g font-size="13" font-weight="600">
        <rect x="282" y="198" width="74" height="24" rx="12" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-opacity="0.5"/><text x="319" y="215" text-anchor="middle" fill="#bae6fd">MCP</text>
        <rect x="362" y="198" width="60" height="24" rx="12" fill="#5eead4" fill-opacity="0.18" stroke="#5eead4" stroke-opacity="0.5"/><text x="392" y="215" text-anchor="middle" fill="#99f6e4">LLM</text>
        <rect x="282" y="230" width="60" height="24" rx="12" fill="#fbbf24" fill-opacity="0.18" stroke="#fbbf24" stroke-opacity="0.5"/><text x="312" y="247" text-anchor="middle" fill="#fde68a">Web</text>
      </g>
      <text x="282" y="278" font-size="13" fill="#94a3b8">Unsure? Every list runs.</text>
    </g>

    <!-- 3 check -->
    <g>
      <rect x="488" y="86" width="194" height="208" rx="16" fill="#0b1f3a" stroke="#38bdf8" stroke-opacity="0.35"/>
      <circle cx="516" cy="116" r="15" fill="url(#wnum)"/><text x="516" y="122" text-anchor="middle" font-size="16" font-weight="800" fill="#06202b">3</text>
      <text x="540" y="123" font-size="19" font-weight="700" fill="#e2e8f0">Check</text>
      <g font-size="14" fill="#cbd5e1">
        <text x="506" y="160">Rules for each chosen</text>
        <text x="506" y="182">list read the facts:</text>
        <text x="506" y="214">AST taint for Python</text>
        <text x="506" y="236">lexical for TS/JS and</text>
        <text x="506" y="258">the LLM and web lists</text>
      </g>
    </g>

    <!-- 4 tidy -->
    <g>
      <rect x="712" y="86" width="194" height="208" rx="16" fill="#0b1f3a" stroke="#38bdf8" stroke-opacity="0.35"/>
      <circle cx="740" cy="116" r="15" fill="url(#wnum)"/><text x="740" y="122" text-anchor="middle" font-size="16" font-weight="800" fill="#06202b">4</text>
      <text x="764" y="123" font-size="19" font-weight="700" fill="#e2e8f0">Tidy</text>
      <g font-size="14" fill="#cbd5e1">
        <text x="730" y="160">Drop what you suppressed</text>
        <text x="730" y="182">Apply the min severity</text>
        <text x="730" y="204">Merge one defect reported</text>
        <text x="730" y="226">by several lists into one</text>
        <text x="730" y="258" fill="#94a3b8">Secrets are redacted.</text>
      </g>
    </g>

    <!-- 5 report -->
    <g>
      <rect x="936" y="86" width="224" height="208" rx="16" fill="#0b1f3a" stroke="#38bdf8" stroke-opacity="0.35"/>
      <circle cx="964" cy="116" r="15" fill="url(#wnum)"/><text x="964" y="122" text-anchor="middle" font-size="16" font-weight="800" fill="#06202b">5</text>
      <text x="988" y="123" font-size="19" font-weight="700" fill="#e2e8f0">Report</text>
      <g font-size="14" fill="#cbd5e1">
        <text x="954" y="160">Terminal  ·  JSON</text>
        <text x="954" y="182">SARIF  ·  PR annotations</text>
        <text x="954" y="214">Exit code for CI:</text>
      </g>
      <g font-size="13" font-weight="600">
        <rect x="954" y="226" width="48" height="26" rx="13" fill="#2dd4bf" fill-opacity="0.2" stroke="#2dd4bf"/><text x="978" y="244" text-anchor="middle" fill="#99f6e4">0 ok</text>
        <rect x="1008" y="226" width="62" height="26" rx="13" fill="#f87171" fill-opacity="0.2" stroke="#f87171"/><text x="1039" y="244" text-anchor="middle" fill="#fecaca">1 found</text>
        <rect x="1076" y="226" width="62" height="26" rx="13" fill="#fbbf24" fill-opacity="0.2" stroke="#fbbf24"/><text x="1107" y="244" text-anchor="middle" fill="#fde68a">2 error</text>
      </g>
    </g>
  </g>
</svg>
