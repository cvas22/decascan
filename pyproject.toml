[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-sift"
version = "0.1.0"
description = "Offline OWASP Top 10 scanner (MCP, LLM applications, web) for Python and TypeScript"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Srinivas Chippagiri" }]
keywords = ["mcp", "security", "owasp", "sast", "model-context-protocol", "llm", "owasp-top-10"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "click>=8.1",
  "rich>=13.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
mcp-sift = "mcp_sift.cli:main"

[project.urls]
Homepage = "https://github.com/cvas22/mcp-sift"
Issues = "https://github.com/cvas22/mcp-sift/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_sift"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["mcp_sift"]

[tool.coverage.report]
# Measured at 91% when this gate was added; the floor leaves room for a small untested change but
# fails a PR that adds a feature without tests.
fail_under = 88
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
# Findings carry their remediation as prose. 110 keeps that text readable in-source instead of
# shredding every sentence across four continuation strings.
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# These modules are tables of regular expressions, which cannot be wrapped without changing them.
"src/mcp_sift/rules/llm_top10.py" = ["E501"]
"src/mcp_sift/rules/web_top10.py" = ["E501"]
