name: dependency-review

# Blocks a pull request that adds a dependency with a known vulnerability.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    # The dependency graph this reads is available on public repositories, and on private ones with
    # GitHub Code Security. The job is skipped until the repository is public.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
