name: stale

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security,good first issue
          exempt-pr-labels: pinned,security
          stale-issue-message: >
            This issue has been marked as stale because it has had no activity for 60 days. It
            will be closed in 14 days unless something new is added.
          stale-pr-message: >
            This pull request has been marked as stale because it has had no activity for 60
            days. It will be closed in 14 days unless something new is added.
          close-issue-message: >
            Closed after 14 days without activity. Reopen it if it still matters.
          close-pr-message: >
            Closed after 14 days without activity. Reopen it if you want to carry on.
