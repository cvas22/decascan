name: code-scanning

# mcp-sift scanning its own source (not the deliberately vulnerable fixtures) and reporting to the
# repository's code scanning tab.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  mcp-sift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF
    steps:
      - uses: actions/checkout@v4

      - uses: ./
        with:
          path: src
          # The rule tables contain the very patterns they detect; scanning them is all noise.
          exclude: rules
          upload-sarif: "true"
          fail-on: critical
