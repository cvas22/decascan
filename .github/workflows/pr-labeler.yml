name: pr-labeler

# Labels a pull request by the paths it changes, using the configuration in .github/labeler.yml.
# `pull_request_target` lets it label pull requests from forks; it is safe here because the job
# never checks out or runs the pull request's code, it only reads the list of changed files.
on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
